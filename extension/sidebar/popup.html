<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: #070a11;
      color: #f1f5f9;
      padding: 16px;
      font-size: 12px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .icon-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(14, 165, 233, 0.05));
      border: 1px solid rgba(14, 165, 233, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
    }
    .brand-title {
      font-weight: 700;
      font-size: 13.5px;
      color: #fff;
    }
    .brand-sub {
      font-size: 9.5px;
      color: #64748b;
      font-weight: 500;
    }
    .status-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.45);
    }
  </style>
</head>
<body>
  <div class="brand-row">
    <div class="icon-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <div>
      <div class="brand-title">Phish Forensics</div>
      <div class="brand-sub">SIH-2026 · PS-02 COPILOT</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color:#94a3b8; display:flex; align-items:center; gap:6px;">
        <span class="status-dot"></span> Gmail Triage Sidebar
      </span>
      <span style="color:#38bdf8; font-family:monospace; font-size:10px; font-weight:bold;">ACTIVE</span>
    </div>
    <div class="status-row">
      <span style="color:#64748b;">Backend Gateway</span>
      <span style="color:#94a3b8; font-family:monospace; font-size:10px;">:8000</span>
    </div>
  </div>

  <a href="http://localhost:5173" target="_blank" class="btn">
    <span>Open Operations Dashboard</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
  </a>
</body>
</html>
